name: Add shield to history section
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-history-shield.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shield and styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('historia.html')
          s = p.read_text(encoding='utf-8')

          css_old = '.story-symbol{background:#fff;border:1px solid #dfe8ee;border-radius:16px;padding:17px}.story-symbol b{display:block;margin-bottom:5px}.story-symbol span{font-size:13px;color:#66717b}@media(max-width:760px){.town-story-grid{grid-template-columns:1fr}.town-story img{height:300px}.story-symbols{grid-template-columns:1fr 1fr}}'
          css_new = '.story-symbol{background:#fff;border:1px solid #dfe8ee;border-radius:16px;padding:17px}.story-symbol b{display:block;margin-bottom:5px}.story-symbol span{font-size:13px;color:#66717b}.shield-showcase{display:flex;justify-content:center;align-items:center;margin:30px 0 34px}.shield-showcase img{width:clamp(170px,20vw,220px);height:auto;display:block;filter:drop-shadow(0 14px 24px rgba(6,38,75,.16))}@media(max-width:760px){.town-story-grid{grid-template-columns:1fr}.town-story img{height:300px}.story-symbols{grid-template-columns:1fr 1fr}.shield-showcase{margin:24px 0 28px}.shield-showcase img{width:170px}}'
          if css_old not in s:
              raise SystemExit('Expected story-symbol CSS block not found')
          s = s.replace(css_old, css_new, 1)

          html_old = '<section class="section"><div class="wrap"><div class="kicker">Nuestro escudo</div><h2>Un símbolo de lo que somos</h2><p class="lead">El nuevo emblema reúne los elementos que nos representan: ciclismo, pueblo, paisaje y tierra.</p><div class="story-symbols">'
          html_new = '<section class="section"><div class="wrap"><div class="kicker">Nuestro escudo</div><h2>Un símbolo de lo que somos</h2><p class="lead">El nuevo emblema reúne los elementos que nos representan: ciclismo, pueblo, paisaje y tierra.</p><div class="shield-showcase"><img src="assets/logo-cdh-oficial-2026.png" alt="Escudo oficial del Club Casas de Haro BTT" width="1200" height="1200" loading="lazy" decoding="async"></div><div class="story-symbols">'
          if html_old not in s:
              raise SystemExit('Expected shield section not found')
          s = s.replace(html_old, html_new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historia.html
          git commit -m 'Show club shield in history section'
          git push
