name: Apply V13 contact and spacing hotfix

on:
  push:
    paths:
      - '.github/workflows/apply-v13-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply site changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.')
          username_url = 'https://wa.me/mcastilloperona'
          phone_url = re.compile(r'https://wa\.me/34696894161(?:\?text=[^"\'<>\s]*)?')

          changed = []
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html', '.js'}:
                  continue
              text = p.read_text(encoding='utf-8')
              new = phone_url.sub(username_url, text)
              new = new.replace(
                  '<span class="wa-note">Contacta con el club</span>',
                  '<span class="wa-note">WhatsApp @mcastilloperona</span>'
              )
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))

          css = Path('assets/v13.css')
          if not css.exists():
              sys.exit('No existe assets/v13.css')
          text = css.read_text(encoding='utf-8')
          new, n = re.subn(
              r'(\.next-route-date\{[^}]*?)margin:0 0 5px',
              r'\1margin:12px 0 6px',
              text,
              count=1
          )
          if n != 1:
              sys.exit('No se ha localizado la regla next-route-date esperada')
          css.write_text(new, encoding='utf-8')
          changed.append(str(css))

          leftovers = []
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html', '.js', '.css'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if '34696894161' in text or '696894161' in text:
                  leftovers.append(str(p))

          if leftovers:
              sys.exit('Quedan referencias al teléfono en: ' + ', '.join(leftovers))

          print('Archivos modificados:')
          for p in changed:
              print(' -', p)
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v13-hotfix.yml
          git add -A
          git commit -m "V13: separar fecha y usar usuario de WhatsApp"
          git push origin main
