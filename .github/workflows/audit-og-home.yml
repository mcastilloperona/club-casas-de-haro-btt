name: Generar OG home JPG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-og-home.yml'

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar Pillow
        run: python -m pip install --quiet Pillow

      - name: Generar JPG 1200x630 y actualizar og:image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('assets/hero-portada-aprobada.webp')
          dst = Path('assets/og-home.jpg')
          index = Path('index.html')

          im = Image.open(src).convert('RGB')
          target_w, target_h = 1200, 630
          target_ratio = target_w / target_h
          crop_w = round(im.height * target_ratio)
          left = min(70, max(0, im.width - crop_w))
          im = im.crop((left, 0, left + crop_w, im.height))
          im = im.resize((target_w, target_h), Image.Resampling.LANCZOS)

          quality = 88
          while True:
              im.save(dst, 'JPEG', quality=quality, optimize=True, progressive=True)
              if dst.stat().st_size < 300 * 1024 or quality <= 72:
                  break
              quality -= 2

          if dst.stat().st_size >= 300 * 1024:
              raise SystemExit(f'og-home.jpg supera 300 KB: {dst.stat().st_size} bytes')

          text = index.read_text(encoding='utf-8')
          old = 'https://casasdeharobtt.es/assets/hero-portada-aprobada.webp'
          new = 'https://casasdeharobtt.es/assets/og-home.jpg'
          if old not in text and new not in text:
              raise SystemExit('No se encontró la etiqueta og:image esperada en index.html')
          text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')

          print(f'Generado {dst}: {dst.stat().st_size} bytes')
          PY

      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og-home.jpg index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Auditoría: usar JPG optimizado para og:image de la home"
            git push
          fi
