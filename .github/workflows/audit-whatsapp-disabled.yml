name: Ajuste final de rutas

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-whatsapp-disabled.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Aplicar ajuste
        run: python3 scripts/afinar_rutas_final.py
      - name: Validar
        run: |
          node --check assets/v13.js
          python3 -m json.tool data/routes.json >/dev/null
          test "$(grep -c '\"discipline\": \"road\"' data/routes.json)" -eq 6
          test "$(grep -c '\"discipline\": \"btt\"' data/routes.json)" -eq 12
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/afinar_rutas_final.py
          git add rutas.html assets/v13.js
          git commit -m "Afinar presentación y enlaces de rutas"
          git push
