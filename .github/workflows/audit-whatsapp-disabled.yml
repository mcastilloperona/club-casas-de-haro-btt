name: Aplicar WhatsApp temporal desactivado

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-whatsapp-disabled.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Desactivar enlaces de WhatsApp sin exponer el teléfono
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('index.html'),
              Path('rutas.html'),
              Path('historia.html'),
              Path('galeria.html'),
              Path('patrocinadores.html'),
              Path('news.html'),
              Path('assets/v13.js'),
          ]

          url = 'https://wa.me/mcastilloperona'
          changed = []

          def disable_anchor(match):
              before = match.group(1)
              after = match.group(2)
              body = match.group(3)
              attrs = (before + after)
              if 'aria-disabled=' not in attrs:
                  disabled = ' aria-disabled="true" tabindex="-1" title="@mcastilloperona · próximamente disponible"'
              else:
                  disabled = ''
              if body.strip() == 'Quiero apuntarme':
                  body = 'WhatsApp · próximamente disponible'
              return f'<a{before}{disabled}{after}>{body}</a>'

          pattern = re.compile(r'<a([^>]*?)\s+href="' + re.escape(url) + r'"([^>]*)>(.*?)</a>', re.S)

          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = pattern.sub(disable_anchor, text)
              text = text.replace('WhatsApp @mcastilloperona', '@mcastilloperona · próximamente disponible')
              text = text.replace('@mcastilloperona · próximamente disponible próximamente disponible', '@mcastilloperona · próximamente disponible')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Archivos modificados:', ', '.join(changed) if changed else 'ninguno')

          leftovers = []
          for path in targets:
              if path.exists() and url in path.read_text(encoding='utf-8'):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Quedan enlaces activos en: ' + ', '.join(leftovers))
          PY

      - name: Commit de la corrección
        run: |
          if git diff --quiet; then
            echo "No hay cambios que confirmar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html rutas.html historia.html galeria.html patrocinadores.html news.html assets/v13.js
          git commit -m "Auditoría: ajustar texto temporal de WhatsApp"
          git push
