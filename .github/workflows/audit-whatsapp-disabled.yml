name: Ajustes de mapa y patrocinadores

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-whatsapp-disabled.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar cambios aprobados
        run: python3 scripts/ajustar_patrocinadores_mapa.py

      - name: Comprobar JavaScript principal
        run: node --check assets/v13.js

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/ajustar_patrocinadores_mapa.py
          git add index.html patrocinadores.html historia.html privacidad.html cookies.html assets/v13.css
          git commit -m "Corregir patrocinadores y cargar mapa automáticamente"
          git push
