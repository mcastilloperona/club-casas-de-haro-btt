name: Corrección de producción y ampliación de rutas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-whatsapp-disabled.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ajustar script de aplicación
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/corregir_produccion_y_rutas.py')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"# Etiqueta más precisa para enlaces de Wikiloc\..*?JS_PATH\.write_text\(js, encoding='utf-8'\)", "JS_PATH.write_text(js, encoding='utf-8')", s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit(f'No se pudo ajustar el bloque de enlace Wikiloc: {n}')
          old="js, nlocal = re.subn(r'const LOCAL_DATA=\\{.*?\\};\\n  async function json', replacement, js, count=1, flags=re.S)"
          new="js, nlocal = re.subn(r'const LOCAL_DATA=\\{.*?\\};\\n  async function json', lambda m: replacement, js, count=1, flags=re.S)"
          if old not in s:
              raise SystemExit('No se encontró la sustitución de LOCAL_DATA esperada')
          s=s.replace(old,new,1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Aplicar cambios aprobados
        run: python3 scripts/corregir_produccion_y_rutas.py

      - name: Validar JavaScript y JSON
        run: |
          node --check assets/v13.js
          python3 -m json.tool data/routes.json >/dev/null
          python3 -m json.tool data/site.json >/dev/null

      - name: Verificar producción
        run: |
          grep -q 'Casas de Haro · Pantano de Alarcón' data/routes.json
          grep -q 'Casas de Haro · Torcas · Senda de Sisante' data/routes.json
          ! grep -q 'sin tocar el HTML' rutas.html
          ! grep -q 'Gestión preparada' rutas.html
          grep -q '<iframe class="google-map-frame"' historia.html
          ! grep -q 'data-load-google-map' historia.html
          ! grep -q 'Casas de Haro · El Picazo · Tébar' assets/v13.js

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/corregir_produccion_y_rutas.py
          git add data/routes.json rutas.html index.html historia.html privacidad.html cookies.html assets/v13.js
          git commit -m "Corregir textos de producción y ampliar rutas BTT y carretera"
          git push
