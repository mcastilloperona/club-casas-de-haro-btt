name: Mejora visual de rutas y patrocinadores

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-whatsapp-disabled.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar cambios aprobados
        run: python3 scripts/mejorar_rutas_patrocinadores.py

      - name: Comprobar JavaScript principal
        run: node --check assets/v13.js

      - name: Verificar alcance
        run: |
          grep -q 'route-origin-external' assets/v13.js
          ! grep -q 'Ruta de la comunidad' assets/v13.js
          grep -q 'MEJORA_RUTAS_VISUAL_START' rutas.html
          grep -q 'SPONSOR_MOBILE_FIX_START' patrocinadores.html

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/mejorar_rutas_patrocinadores.py
          git add assets/v13.js rutas.html patrocinadores.html
          git commit -m "Mejorar visualización de rutas y patrocinadores en móvil"
          git push
