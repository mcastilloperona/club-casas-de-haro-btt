name: Simplificar colaboradores

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-whatsapp-disabled.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar simplificación aprobada
        run: python3 scripts/simplificar_colaboradores.py

      - name: Comprobar JavaScript
        run: node --check assets/colaboradores.js

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/simplificar_colaboradores.py
          git add patrocinadores.html assets/colaboradores.css assets/colaboradores.js .pages.yml
          git commit -m "Simplificar espacio de colaboradores"
          git push
