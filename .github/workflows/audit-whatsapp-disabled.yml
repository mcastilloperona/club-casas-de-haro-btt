name: Aplicar espacio de colaboradores

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-whatsapp-disabled.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar cambios aprobados
        run: python3 scripts/aplicar_colaboradores.py

      - name: Comprobar JavaScript
        run: node --check assets/colaboradores.js

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/aplicar-colaboradores-once.yml scripts/aplicar_colaboradores.py
          git add patrocinadores.html data/collaborators.json assets/colaboradores.css assets/colaboradores.js .pages.yml
          git commit -m "Añadir espacio de colaboradores del club"
          git push
