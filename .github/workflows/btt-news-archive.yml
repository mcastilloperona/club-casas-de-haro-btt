name: Improve BTT News archive

on:
  push:
    paths:
      - '.github/workflows/btt-news-archive.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        run: python .github/scripts/update_btt_news.py
      - name: Validate JavaScript
        run: node --check assets/v13.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/btt-news-archive.yml .github/scripts/update_btt_news.py
          git add -A
          git commit -m "V13: mejorar BTT News con galería e histórico"
          git push origin main
