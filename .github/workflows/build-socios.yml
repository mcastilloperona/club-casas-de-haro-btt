name: Build socios app

on:
  push:
    branches: [main]
    paths:
      - 'socios-app/**'
      - '.github/workflows/build-socios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-socios-main
  cancel-in-progress: true

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    env:
      VITE_SOCIOS_ENABLED: 'true'
      VITE_SUPABASE_URL: 'https://tjdtbsroqpbpkyysqjuv.supabase.co'
      VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_VXbpBq92DkRXR7GB4UlT4A_rlVMk9No'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: socios-app/package-lock.json

      - name: Install
        working-directory: socios-app
        run: npm ci

      - name: Test
        working-directory: socios-app
        run: npm test

      - name: Build production
        working-directory: socios-app
        run: npm run build

      - name: Publish compiled socios app
        run: |
          if git diff --quiet -- socios; then
            echo "No compiled changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add socios
          git commit -m "Build socios app"
          git push
