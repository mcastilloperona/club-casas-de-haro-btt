name: Enhance Casas de Haro intro
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enhance-casas-haro-intro.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Casas de Haro intro
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('historia.html')
          s = p.read_text(encoding='utf-8')

          old_kicker = '<div class="kicker">Casas de Haro · Cuenca</div>'
          new_kicker = '<div class="kicker">Casas de Haro, Provincia de Cuenca</div>'
          if old_kicker not in s:
              raise SystemExit('Expected Casas de Haro kicker not found')
          s = s.replace(old_kicker, new_kicker, 1)

          anchor = '<p class="lead">Para nosotros no es solo el lugar desde el que salimos en bicicleta. Es el terreno que conocemos, el que recorremos una y otra vez y el que queremos enseñar a quien pedalea con nosotros.</p>'
          addition = anchor + '<p class="lead">Hay lugares que se visitan y otros que se llevan dentro. Casas de Haro es de esos. Cada camino entre viñas, cada horizonte abierto y cada luz sobre el pueblo nos recuerda de dónde venimos. Pedalear aquí es volver a casa, incluso cuando nunca nos hemos ido.</p><p class="lead">Y eso es lo que queremos compartir con quien llegue: no solo una ruta, sino la sensación de formar parte, aunque sea por unas horas, de un paisaje, de una historia y de una manera muy nuestra de entender la bicicleta.</p>'
          if anchor not in s:
              raise SystemExit('Expected town intro paragraph not found')
          s = s.replace(anchor, addition, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historia.html
          git commit -m 'Enhance Casas de Haro introduction'
          git push
