name: Finalize history photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-history-photo.yml'

permissions:
  contents: write

jobs:
  fix-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify photo
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/history_fix_0.bin .tmp/history_fix_1.bin .tmp/history_fix_2.bin > assets/historia-club-cdh.webp
          test "$(wc -c < assets/historia-club-cdh.webp)" -eq 21360
          echo "2b9fcba444cdffef3045bf51897c3a85c9ecc43e4b14dff366a751152c89cfb9  assets/historia-club-cdh.webp" | sha256sum -c -
          file assets/historia-club-cdh.webp | grep -q 'Web/P image'
          sed -i 's/v=20260910-2/v=20260910-3/g' historia.html

      - name: Commit verified photo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .tmp/history_fix_0.bin .tmp/history_fix_1.bin .tmp/history_fix_2.bin .github/workflows/finalize-history-photo.yml
          git add assets/historia-club-cdh.webp historia.html
          git commit -m 'Replace broken history photo with verified image'
          git push
