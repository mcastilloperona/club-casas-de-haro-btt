name: Fix BTT News images

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-btt-news-images.yml

permissions:
  contents: write

jobs:
  fix-news-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply image layout fix
        shell: bash
        run: |
          cat >> assets/v13.css <<'EOF'

          /* V13 RC19 — BTT News: imagen a sangre y proporción uniforme */
          .news-card{
            align-items:stretch!important;
          }
          .news-card .news-main-image{
            display:block!important;
            width:100%!important;
            max-width:none!important;
            height:auto!important;
            aspect-ratio:4 / 3!important;
            object-fit:cover!important;
            object-position:center center!important;
            margin:0!important;
            padding:0!important;
            background:transparent!important;
            align-self:stretch!important;
          }
          EOF

          for f in *.html; do
            sed -E -i 's#assets/v13\.css(\?v=[^" ]*)?#assets/v13.css?v=20260912-rc19#g' "$f"
          done

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/v13.css *.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: imágenes BTT News a sangre en las tarjetas"
          git push
