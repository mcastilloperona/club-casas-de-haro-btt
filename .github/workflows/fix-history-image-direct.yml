name: Switch to high quality history image
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-history-image-direct.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update history image reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('historia.html')
          s = p.read_text(encoding='utf-8')
          old = 'src="assets/historia-club-cdh.webp?v=20260910-2"'
          new = 'src="assets/historia-club-cdh-hq.webp?v=20260910-hq"'
          if old not in s:
              raise SystemExit('Expected history image reference not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historia.html
          git commit -m 'Use high quality history club image'
          git push
