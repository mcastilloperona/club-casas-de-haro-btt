name: Fix history WhatsApp preview
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update Open Graph image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('historia.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://casasdeharobtt.es/assets/grupo-castillo.jpg'
          new = 'https://casasdeharobtt.es/assets/historia-club-cdh-v2.webp?v=20260910-4'
          if old not in s:
              raise SystemExit('Old OG image reference not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia.html
          git diff --cached --quiet || git commit -m "Update history social preview image"
          git push
