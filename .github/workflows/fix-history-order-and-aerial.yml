name: Fix history order and aerial photo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-history-order-and-aerial.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and validate aerial photo
        run: |
          cat .github/tmp/final-aerial-00.b64 .github/tmp/final-aerial-01.b64 .github/tmp/final-aerial-02.b64 .github/tmp/final-aerial-03.b64 .github/tmp/final-aerial-04.b64 | tr -d '\n\r' | base64 -d > /tmp/vista-aerea.webp
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/vista-aerea.webp').read_bytes()
          assert len(b)==36168, f'Unexpected size: {len(b)}'
          assert b[:4]==b'RIFF' and b[8:12]==b'WEBP', 'Invalid WEBP file'
          Path('assets/vista-aerea-casas-de-haro-v2.webp').write_bytes(b)
          PY
      - name: Put Wikipedia history first and use validated photo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('historia.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/vista-aerea-casas-de-haro(?:-v2)?\.(?:jpg|webp)\?v=20260910-[0-9]+','assets/vista-aerea-casas-de-haro-v2.webp?v=20260910-3',s)
          story=re.search(r'<section class="section town-story">.*?</section>',s,re.S)
          hist=re.search(r'<section class="section town-history">.*?</section>',s,re.S)
          club=re.search(r'<section class="section history">.*?</section>',s,re.S)
          shield=re.search(r'<section class="section"><div class="wrap"><div class="kicker">Nuestro escudo</div>.*?</section>',s,re.S)
          assert story and hist and club and shield, 'Expected sections not found'
          blocks=[hist.group(0),story.group(0),club.group(0),shield.group(0)]
          start=min(x.start() for x in (story,hist,club,shield))
          end=max(x.end() for x in (story,hist,club,shield))
          s=s[:start]+'\n'.join(blocks)+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historia.html assets/vista-aerea-casas-de-haro-v2.webp
          git commit -m 'Fix history order and aerial photo'
          git push
