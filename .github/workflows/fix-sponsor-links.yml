name: Fix sponsor carousel links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sponsor-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix clickable sponsor carousel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_card = ".club-partner-card{position:absolute;inset:0;display:grid;grid-template-columns:minmax(180px,340px) 1fr;align-items:center;gap:34px;color:#fff;opacity:0;transform:translateX(35px);animation:partnerCycle 16s infinite ease-in-out}"
          new_card = ".club-partner-card{position:absolute;inset:0;display:grid;grid-template-columns:minmax(180px,340px) 1fr;align-items:center;gap:34px;color:#fff;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(35px);animation:partnerCycle 16s infinite ease-in-out}"

          old_keyframes = "@keyframes partnerCycle{0%{opacity:0;transform:translateX(35px)}4%,21%{opacity:1;transform:translateX(0)}25%,100%{opacity:0;transform:translateX(-35px)}}"
          new_keyframes = "@keyframes partnerCycle{0%{opacity:0;visibility:hidden;pointer-events:none;transform:translateX(35px)}4%,21%{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0)}25%,100%{opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-35px)}}"

          old_reduced = ".club-partner-card.partner1{opacity:1!important}"
          new_reduced = ".club-partner-card.partner1{opacity:1!important;visibility:visible!important;pointer-events:auto!important}"

          for old, new, label in [
              (old_card, new_card, 'card'),
              (old_keyframes, new_keyframes, 'keyframes'),
              (old_reduced, new_reduced, 'reduced-motion'),
          ]:
              if old not in s:
                  raise RuntimeError(f'No se encontró el bloque esperado: {label}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          print('Carrusel corregido: solo el patrocinador visible recibe clics.')
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix sponsor carousel links'
          git push

