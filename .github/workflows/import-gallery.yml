name: Import gallery photos
on:
  push:
    paths:
      - '.github/workflows/import-gallery.yml'
      - 'gallery-import-trigger.txt'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gdown pillow
      - name: Download and optimize legacy gallery photos
        shell: bash
        run: |
          set -e
          mkdir -p assets/gallery
          python - <<'PY'
          import gdown
          from PIL import Image, ImageOps
          from pathlib import Path

          ids = [
            '15aY9j2njWHHQoQ5UWh6P42qGs1IsGwJS',
            '1xHgKkbZg2u2Hf4MlGXY_7n7Q5HYdCBCG',
            '1c0N1_au4SPZORR5OPNVl-ajO4zY5cx2Q',
            '1DS_fFDplzF6Jmeetmh_NvU05zPE0_QcJ',
            '1OQL7YkwhIKGoYhOoN3EBQVSMNG04TPyN',
            '1Z2hdsacVejUmH8_0imisJoy7Xzz4YuyF',
            '1i4Udse3VTpWpuft9zCZSFUHBsHkwsaHL',
            '1JTo4yFLrNGB23G-7Vpmbj_QjTFnYBC78',
            '1gklijf9K5DYwLqfQtqVJGYifUM-4IrKz',
            '1ntiBjR8wXqmcW2FKUv7e03i0FS50xleH'
          ]

          for i, fid in enumerate(ids, 1):
              tmp = f'/tmp/gallery-{i:02}.img'
              out = Path(f'assets/gallery/galeria-{i:02}.jpg')
              result = gdown.download(id=fid, output=tmp, quiet=False)
              if not result:
                  raise RuntimeError(f'No se pudo descargar la foto {i}')
              im = ImageOps.exif_transpose(Image.open(tmp)).convert('RGB')
              im.thumbnail((1920, 1920), Image.Resampling.LANCZOS)
              im.save(out, 'JPEG', quality=84, optimize=True, progressive=True)
          PY
      - name: Point only legacy Drive entries to repository files
        run: |
          python - <<'PY'
          import json

          p = 'data/gallery.json'
          with open(p, encoding='utf-8') as f:
              data = json.load(f)

          if len(data) < 15:
              raise RuntimeError('La galería no contiene las entradas esperadas')

          # Las posiciones 6–15 son las diez fotos antiguas que aún apuntaban a Drive.
          # Conservamos sus textos y todas las fotos añadidas después, incluidas las 13 nuevas.
          for i in range(10):
              entry = data[5 + i]
              entry['image'] = f'assets/gallery/galeria-{i + 1:02}.jpg'

          with open(p, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
      - name: Commit repository-hosted legacy gallery and remove importer
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/gallery data/gallery.json
          git rm .github/workflows/import-gallery.yml
          rm -f gallery-import-trigger.txt
          git add -A
          git commit -m 'Alojar fotos antiguas de galería en el repositorio'
          git push
