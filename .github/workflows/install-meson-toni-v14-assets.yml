name: Instalar recursos Mesón Bar Toñi V14

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-meson-toni-v14-assets.yml
      - .tmp/meson-toni-photo-01.b64
      - .tmp/meson-toni-photo-02.b64
      - .tmp/meson-toni-photo-03.b64
      - .tmp/meson-toni-photo-04.b64
      - .tmp/meson-toni-photo-05.b64
      - .tmp/meson-toni-logo-01.b64
      - .tmp/meson-toni-logo-02.b64

permissions:
  contents: write

jobs:
  install-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Reconstruir imágenes
        run: |
          cat .tmp/meson-toni-photo-01.b64 .tmp/meson-toni-photo-02.b64 .tmp/meson-toni-photo-03.b64 .tmp/meson-toni-photo-04.b64 .tmp/meson-toni-photo-05.b64 | tr -d '\n\r ' | base64 --decode > assets/meson-toni-colaborador.jpg
          cat .tmp/meson-toni-logo-01.b64 .tmp/meson-toni-logo-02.b64 | tr -d '\n\r ' | base64 --decode > assets/meson-toni-logo.jpg
          test -s assets/meson-toni-colaborador.jpg
          test -s assets/meson-toni-logo.jpg
          file assets/meson-toni-colaborador.jpg assets/meson-toni-logo.jpg

      - name: Publicar recursos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/meson-toni-colaborador.jpg assets/meson-toni-logo.jpg
          if git diff --cached --quiet; then
            echo "Recursos ya actualizados"
            exit 0
          fi
          git commit -m "V14: añadir recursos de Mesón Bar Toñi"
          git push
