name: Instalar logo final Mesón Bar Toñi V14

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-meson-toni-v14-logo-final.yml
      - v14/meson-toni-logo-final.b64

permissions:
  contents: write

jobs:
  install-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Reconstruir logo final
        run: |
          tr -d '\n\r ' < v14/meson-toni-logo-final.b64 | base64 --decode > v14/meson-toni-logo-final.png
          test -s v14/meson-toni-logo-final.png
          file v14/meson-toni-logo-final.png

      - name: Publicar logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v14/meson-toni-logo-final.png
          if git diff --cached --quiet; then
            echo "Logo ya actualizado"
            exit 0
          fi
          git commit -m "V14: instalar logo final de Mesón Bar Toñi"
          git pull --rebase origin main
          git push
