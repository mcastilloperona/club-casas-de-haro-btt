name: Link Recreativos Aroca

on:
  push:
    paths:
      - '.github/workflows/link-recreativos-aroca.yml'

permissions:
  contents: write

jobs:
  patch-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update sponsor links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          url='https://recreativosaroca.es/'

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old='<a class="club-partner-card partner1" href="patrocinadores.html">'
          new=f'<a class="club-partner-card partner1" target="_blank" rel="noopener" href="{url}">'
          if old not in text:
              raise SystemExit('No se encontró el enlace de Recreativos Aroca en index.html')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('patrocinadores.html')
          text=p.read_text(encoding='utf-8')
          old='<div class="sponsor"><img src="assets/recreativos-aroca.jpg" alt="Recreativos Aroca" width="1536" height="684" loading="lazy" decoding="async"></div>'
          new=f'<a class="sponsor" target="_blank" rel="noopener" href="{url}"><img src="assets/recreativos-aroca.jpg" alt="Recreativos Aroca" width="1536" height="684" loading="lazy" decoding="async"></a>'
          if old not in text:
              raise SystemExit('No se encontró la tarjeta de Recreativos Aroca en patrocinadores.html')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/link-recreativos-aroca.yml
          git add index.html patrocinadores.html
          git commit -m "Añadir web de Recreativos Aroca"
          git push origin main
