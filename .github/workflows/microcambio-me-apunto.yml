name: Microcambio Me apunto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/microcambio-me-apunto.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar cambio
        run: python3 scripts/microcambio_me_apunto.py

      - name: Validar
        run: |
          node --check assets/v13.js
          python3 -m py_compile scripts/sync_next_route.py
          test "$(grep -c 'const LOCAL_DATA' assets/v13.js)" -eq 1

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/microcambio_me_apunto.py
          git add index.html rutas.html assets/v13.js scripts/sync_next_route.py
          git commit -m "Interfaz: añadir botón Me apunto en próxima salida"
          git push
