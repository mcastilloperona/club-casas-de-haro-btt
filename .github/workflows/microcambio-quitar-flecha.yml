name: Microcambio quitar flecha

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/microcambio-quitar-flecha.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Quitar únicamente la flecha
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='Próximas rutas →'
          new='Próximas rutas'
          if s.count(old) != 1:
              raise SystemExit(f'Se esperaba exactamente una aparición de {old!r} y hay {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          if old in s or s.count(new) < 1:
              raise SystemExit('Validación fallida')
          PY

      - name: Publicar microcambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Portada: quitar flecha de Próximas rutas"
          git push
