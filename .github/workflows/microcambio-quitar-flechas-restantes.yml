name: Microcambio quitar flechas restantes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/microcambio-quitar-flechas-restantes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revisar y quitar flechas visibles
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('index.html'),
              Path('rutas.html'),
              Path('historia.html'),
              Path('galeria.html'),
              Path('news.html'),
              Path('patrocinadores.html'),
              Path('aviso-legal.html'),
              Path('privacidad.html'),
              Path('cookies.html'),
              Path('assets/v13.js'),
              Path('assets/colaboradores.js'),
          ]

          found = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              count = text.count('→') + text.count('←')
              if count:
                  found.append((str(path), count))
                  text = text.replace(' →', '').replace('→', '')
                  text = text.replace('← ', '').replace('←', '')
                  path.write_text(text, encoding='utf-8')

          print('Flechas retiradas:', found)

          for path in files:
              text = path.read_text(encoding='utf-8')
              if '→' in text or '←' in text:
                  raise SystemExit(f'Queda alguna flecha visible en {path}')

          expected = {
              'index.html': ['Explorar todas las rutas', 'Conoce nuestra historia'],
              'rutas.html': ['Volver al inicio', 'Buscar más rutas en Wikiloc'],
              'assets/v13.js': ['Ver BTT News'],
          }
          for name, labels in expected.items():
              text = Path(name).read_text(encoding='utf-8')
              for label in labels:
                  if label not in text:
                      raise SystemExit(f'No se encontró {label!r} tras el cambio en {name}')
          PY

      - name: Validar JavaScript
        run: node --check assets/v13.js

      - name: Publicar microcambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No había flechas adicionales que retirar"
            exit 0
          fi
          git add index.html rutas.html historia.html galeria.html news.html patrocinadores.html aviso-legal.html privacidad.html cookies.html assets/v13.js assets/colaboradores.js
          git commit -m "Interfaz: quitar flechas restantes"
          git push
