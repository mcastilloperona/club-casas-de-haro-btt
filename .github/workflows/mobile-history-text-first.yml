name: Mobile history text first
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mobile-history-text-first.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder Club history block on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('historia.html')
          s = p.read_text(encoding='utf-8')
          old = '.route,.history-grid{grid-template-columns:1fr}.route img{min-height:240px}'
          new = '.route,.history-grid{grid-template-columns:1fr}.history-grid{gap:24px}.history-grid>div{order:1}.history-grid>img{order:2}.route img{min-height:240px}'
          if old not in s:
              raise SystemExit('Expected mobile history CSS not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historia.html
          git commit -m 'Show Club history text before photo on mobile'
          git push
