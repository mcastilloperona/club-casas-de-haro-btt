name: Regenerar iconos PWA con el escudo oficial
on:
  push:
    branches: [fix/pwa-iconos-reales-20261009]
    paths:
      - 'tools/pwa-icons.py'
      - '.github/workflows/pwa-icons.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/pwa-icons.py
      - name: Commit generated PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png assets/icon-maskable-512.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(pwa): regenerar PNG correctos con escudo oficial"
          git push
