name: Replace history club image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-history-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace history image reference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('historia.html')
          s = p.read_text(encoding='utf-8')
          old = '<img src="assets/grupo-castillo.jpg" alt="Grupo de ciclistas de Casas de Haro BTT" width="1536" height="864" loading="lazy" decoding="async">'
          new = '<img src="assets/historia-club-cdh.svg" alt="Ciclistas del Club Casas de Haro BTT rodando al atardecer entre caminos manchegos y aerogeneradores" width="750" height="1000" loading="lazy" decoding="async" style="max-height:none;height:auto;object-fit:contain">'
          if old not in s:
              raise RuntimeError('No se encontró la imagen actual del bloque Club Casas de Haro BTT')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historia.html
          git commit -m 'Update Club Casas de Haro BTT history image'
          git push
