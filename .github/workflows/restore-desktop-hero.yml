name: Restore desktop homepage hero
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-desktop-hero.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous desktop hero only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "@media(min-width:901px){\n  .home-v12{display:flex!important}\n  .approved-hero-desktop{display:none!important}\n  .wa-wrap{display:none!important}\n}"
          new = "@media(min-width:901px){\n  .home-v12{display:none!important}\n  .approved-hero-desktop{display:block}\n  .wa-wrap{display:none!important}\n}"
          assert old in s, 'Current unified desktop hero block not found'
          s = s.replace(old, new, 1)
          assert 'href=\"historia.html#casas-de-haro\">Descubre Casas de Haro</a>' in s
          assert '<a href=\"historia.html\">Historia</a><a href=\"rutas.html\">Rutas</a>' in s
          p.write_text(s, encoding='utf-8')
          print('Desktop hero restored; navigation and lower CTA preserved')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore previous desktop homepage hero'
          git push
