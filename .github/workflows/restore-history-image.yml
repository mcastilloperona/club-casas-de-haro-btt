name: Restore working history image
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-history-image.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good image reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('historia.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/historia-club-cdh-hq.webp?v=20260910-hq'
          new = 'assets/historia-club-cdh.webp?v=20260910-2'
          if old not in s:
              raise SystemExit('Broken HQ reference not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historia.html
          git commit -m 'Restore working history image'
          git push
