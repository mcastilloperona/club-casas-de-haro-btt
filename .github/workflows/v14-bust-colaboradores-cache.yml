name: V14 bust colaboradores cache
on:
  push:
    paths:
      - '.github/workflows/v14-bust-colaboradores-cache.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar versión del script de colaboradores
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v14/patrocinadores.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('../assets/colaboradores.js" defer', '../assets/colaboradores.js?v=20260913-6" defer')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v14/patrocinadores.html
          git diff --cached --quiet || git commit -m "V14: refrescar script de colaboradores"
          git push
