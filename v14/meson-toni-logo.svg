<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Mesón Bar Toñi</title>
<desc id="desc">Logo de Mesón Bar Toñi. Ctra. La Roda, 27. Teléfono 603038601. Casas de Haro, Cuenca.</desc>
<defs>
  <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="11" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="faded"><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
  </filter>
</defs>
